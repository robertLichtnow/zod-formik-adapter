name: Release
on: workflow_dispatch

permissions:
  contents: write # push the release tag and create the GitHub release
  issues: write # comment on released issues and open an issue when a release fails
  pull-requests: write # comment on released pull requests
  id-token: write # publish to npm with trusted publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build distributable
        run: yarn build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
